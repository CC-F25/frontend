<!DOCTYPE html>
<html lang="en">
<script src="https://accounts.google.com/gsi/client" async defer></script>

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Create Account - Apartment Booking</title>
    <link rel="stylesheet" href="styles.css">
</head>

<body>
    <nav class="navbar">
        <div class="nav-brand">Apartments</div>
        <div class="nav-links">
            <button class="nav-item active" onclick="showSection('home')">Sign Up</button>
            <button class="nav-item" onclick="showSection('listings')">Listings</button>
            <button class="nav-item" onclick="showSection('bookings')">My Bookings</button>
        </div>
        <div class="nav-controls">
            <label class="toggle-switch">
                <input type="checkbox" id="localModeToggle" onchange="toggleLocalMode()">
                <span class="slider"></span>
            </label>
            <span class="toggle-label">Local Mode</span>
        </div>
    </nav>

    <div id="home-section" class="section active">
        <div class="container">
            <h1>Welcome to Apartments</h1>
            <p class="subtitle" id="login-subtitle">Please Sign In to start booking</p>

            <div id="auth-section" style="margin-bottom: 30px; padding: 20px; border: 1px dashed #ccc; text-align: center;">
                <div id="g_id_onload"
                     data-client_id="258517926293-f4tlnulrid7ejrg0b9j8d3p8infshrhv.apps.googleusercontent.com"
                     data-callback="handleCredentialResponse"
                     data-auto_prompt="false">
                </div>
                <div class="g_id_signin"
                     data-type="standard"
                     data-size="large"
                     data-theme="filled_blue"
                     data-text="sign_in_with"
                     data-shape="rectangular"
                     data-logo_alignment="left">
                </div>
                <p id="auth-status" style="margin-top: 10px; font-weight: bold;"></p>
            </div>

            <form id="signupForm" style="display: none; opacity: 0; transition: opacity 0.5s;">
                <h2 style="border-bottom: 2px solid #6c5ce7; padding-bottom: 10px; margin-bottom: 20px;">Complete Your Profile</h2>
                
                <h3 style="margin-top: 0; color: #555;">Identity</h3>
                <div class="form-group">
                    <label for="name">Full Name</label>
                    <input type="text" id="name" name="name" readonly style="background-color: #f0f0f0; cursor: not-allowed;">
                </div>

                <div class="form-group">
                    <label for="email">Email</label>
                    <input type="email" id="email" name="email" readonly style="background-color: #f0f0f0; cursor: not-allowed;">
                </div>

                <div class="form-group">
                    <label for="phone">Phone Number <span class="required">*</span></label>
                    <input type="tel" id="phone" name="phone" required placeholder="+1 (555) 123-4567">
                </div>

                <div class="form-group">
                    <label for="location">Current City</label>
                    <input type="text" id="location" name="location" placeholder="e.g. New York, NY">
                </div>

                <div class="form-group">
                    <label for="bio">Bio / About Me</label>
                    <textarea id="bio" name="bio" rows="2" style="width: 100%; padding: 8px; border: 1px solid #ddd; border-radius: 4px;" placeholder="Student at Columbia..."></textarea>
                </div>

                <div class="preferences-section" style="margin-top: 30px; padding-top: 20px; border-top: 1px dashed #ccc;">
                    <h3 style="margin-top: 0; color: #555;">Apartment Preferences</h3>

                    <div class="form-group">
                        <label for="maxBudget">Maximum Budget ($/month) <span class="required">*</span></label>
                        <input type="number" id="maxBudget" name="maxBudget" required placeholder="2000" min="0">
                    </div>

                    <div class="input-group">
                        <div class="form-group">
                            <label for="minSize">Min Size (sq ft) <span class="required">*</span></label>
                            <input type="number" id="minSize" name="minSize" required placeholder="500" min="0">
                        </div>

                        <div class="form-group">
                            <label for="rooms">Bedrooms <span class="required">*</span></label>
                            <select id="rooms" name="rooms" required>
                                <option value="">Select...</option>
                                <option value="0">Studio</option>
                                <option value="1">1 Bedroom</option>
                                <option value="2">2 Bedrooms</option>
                                <option value="3">3 Bedrooms</option>
                                <option value="4">4+ Bedrooms</option>
                            </select>
                        </div>
                    </div>

                    <div class="form-group">
                        <label for="prefLocation">Preferred Neighborhoods <span class="required">*</span></label>
                        <input type="text" id="prefLocation" name="prefLocation" required placeholder="Downtown, Brooklyn, etc.">
                    </div>
                </div>

                <button type="submit" class="button" id="submitBtn" style="margin-top: 20px;">Save Profile & Continue</button>
            </form>

            <div id="message" class="message"></div>
        </div>
    </div>

    <div id="listings-section" class="section">
        <div class="container wide-container">
            <h1>Available Apartments</h1>
            <p class="subtitle">Browse the latest listings</p>

            <div class="filters">
                <input type="number" id="filter-min-rent" placeholder="Min Rent">
                <input type="number" id="filter-max-rent" placeholder="Max Rent">
                <button class="button small-btn" onclick="fetchListings()">Search</button>
            </div>

            <div class="table-container">
                <table id="listings-table">
                    <thead>
                        <tr>
                            <th>Title</th>
                            <th>Target</th>
                            <th>Details</th>
                            <th>Location</th>
                            <th>Rent</th>
                            <th>Action</th>
                        </tr>
                    </thead>
                    <tbody id="listings-body">
                    </tbody>
                </table>
            </div>
        </div>
    </div>

    <div id="bookings-section" class="section">
        <div class="container">
            <h1>My Bookings</h1>
            <p class="subtitle">Your upcoming reservations</p>

            <div class="form-group">
                <label for="booking-user-id">Enter User ID to View Bookings:</label>
                <div class="input-group">
                    <input type="text" id="booking-user-id" placeholder="User UUID">
                    <button class="button small-btn" onclick="loadUserBookings()">Load</button>
                </div>
            </div>

            <div id="bookings-list" class="bookings-list">
            </div>
        </div>
    </div>

    <script src="app.js?v=7"></script>
</body>
</html>
